name: NPM Cache Lab

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cache-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js and npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test
        run: node -e "console.log('Node.js CI test passed')"
