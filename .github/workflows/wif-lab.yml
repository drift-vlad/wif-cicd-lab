
name: WIF Security Lab

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  oidc-inspection:
    runs-on: ubuntu-latest
    steps:
      - name: Request and verify GitHub OIDC token
        uses: actions/github-script@v7
        with:
          script: |
            const tokenUrl = new URL(
              process.env.ACTIONS_ID_TOKEN_REQUEST_URL
            );
            tokenUrl.searchParams.set('audience', 'lab');

            const response = await fetch(tokenUrl, {
              headers: {
                Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}`
              }
            });

            if (!response.ok) {
              throw new Error(`OIDC request failed: ${response.status}`);
            }

            const result = await response.json();
            const token = result.value;
            const payload = token.split('.')[1];
            const claims = JSON.parse(
              Buffer.from(payload, 'base64url').toString('utf8')
            );

            const expectedRepository = 'drift-vlad/wif-cicd-lab';
            const expectedRef = 'refs/heads/main';

            if (claims.repository !== expectedRepository) {
              throw new Error('Repository claim did not match');
            }

            if (claims.ref !== expectedRef) {
              throw new Error('Branch claim did not match');
            }

            if (claims.aud !== 'lab') {
              throw new Error('Audience claim did not match');
            }

            console.log('GitHub OIDC token obtained successfully');
            console.log('Issuer:', claims.iss);
            console.log('Audience:', claims.aud);
            console.log('Repository claim matched');
            console.log('Branch claim matched');
            console.log('OIDC identity checks passed');
