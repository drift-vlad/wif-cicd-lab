
name: WIF Security Lab

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  legacy-auth-simulation:
    runs-on: ubuntu-latest
    steps:
      - name: Simulate legacy credential usage
        env:
          LEGACY_CLOUD_KEY: ${{ secrets.LEGACY_CLOUD_KEY }}
        run: |
          if [ -z "$LEGACY_CLOUD_KEY" ]; then
            echo "Legacy credential is missing"
            exit 1
          fi

          echo "Legacy credential is configured"
          echo "Credential value is not displayed"
