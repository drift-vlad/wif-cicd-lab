
name: WIF Security Lab

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  oidc-inspection:
    runs-on: ubuntu-latest
    steps:
      - name: Request GitHub OIDC token
        uses: actions/github-script@v7
        with:
          script: |
            const response = await fetch(
              `${process.env.ACTIONS_ID_TOKEN_REQUEST_URL}&audience=lab`,
              {
                headers: {
                  Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}`
                }
              }
            );

            if (!response.ok) {
              throw new Error(`OIDC request failed: ${response.status}`);
            }

            const result = await response.json();
            const token = result.value;

            // Decode claims only; never print the token itself.
            const payload = token.split('.')[1];
            const claims = JSON.parse(
              Buffer.from(payload, 'base64url').toString('utf8')
            );

            console.log("GitHub OIDC token obtained successfully");
            console.log("Issuer:", claims.iss);
            console.log("Audience:", claims.aud);
            console.log("Repository:", claims.repository);
            console.log("Ref:", claims.ref);
            console.log("Subject:", claims.sub);
